<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Study Notes Generator</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 750px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 20px auto; }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; }
    textarea { width: 100%; height: 160px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { background-color: #2563eb; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
    button:hover { background-color: #1d4ed8; }
    .results { margin-top: 25px; display: none; }
    .summary-box { background-color: #eff6ff; border-left: 4px solid #2563eb; padding: 15px; border-radius: 6px; font-size: 15px; color: #1e293b; }
    .metrics-grid { display: flex; justify-content: space-between; margin-top: 20px; }
    .metric-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; text-align: center; flex: 1; margin: 0 5px; }
    .metric-card h3 { margin: 0; font-size: 22px; color: #2563eb; }
    .metric-card p { margin: 5px 0 0; font-size: 12px; color: #64748b; }
    .error { color: #dc2626; margin-top: 10px; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Smart Study Notes Generator</h1>
    <p style="text-align:center; color:#64748b;">Convert long academic paragraphs into quick summaries.</p>
    
    <textarea id="inputText" placeholder="Paste your study paragraph here..."></textarea>
    <button id="btn" onclick="generateNotes()">Generate Summary & Metrics</button>
    <div id="errorBox" class="error"></div>

    <div id="results" class="results">
      <h3>📌 Generated Summary</h3>
      <div id="summaryText" class="summary-box"></div>

      <div class="metrics-grid">
        <div class="metric-card"><h3 id="origCount">0</h3><p>Original Words</p></div>
        <div class="metric-card"><h3 id="sumCount">0</h3><p>Summary Words</p></div>
        <div class="metric-card"><h3 id="reduction">0%</h3><p>Text Reduction</p></div>
      </div>
    </div>
  </div>

  <script>
    async function generateNotes() {
      const text = document.getElementById('inputText').value;
      const btn = document.getElementById('btn');
      const errorBox = document.getElementById('errorBox');
      const results = document.getElementById('results');

      errorBox.style.display = 'none';
      results.style.display = 'none';

      if(!text.trim()) {
        errorBox.innerText = 'Please paste some text first.';
        errorBox.style.display = 'block';
        return;
      }

      btn.innerText = 'Analyzing & Summarizing...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Server error');

        document.getElementById('summaryText').innerText = data.summary;
        document.getElementById('origCount').innerText = data.orig_count;
        document.getElementById('sumCount').innerText = data.summary_count;
        document.getElementById('reduction').innerText = data.reduction_pct + '%';

        results.style.display = 'block';
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      } finally {
        btn.innerText = 'Generate Summary & Metrics';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
